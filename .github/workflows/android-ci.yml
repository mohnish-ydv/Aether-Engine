name: Aether Android CI M18

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make launchers executable
        run: chmod +x gradlew verify.sh

      - name: Gradle preflight
        run: ./gradlew --no-daemon --version

      - name: Source and configuration audit
        run: bash verify.sh --source-only

      - name: Clean Android manifest and resource compilation
        run: >-
          ./gradlew --no-daemon --stacktrace clean
          :app:processDebugMainManifest
          :app:processReleaseMainManifest
          :app:mergeDebugResources
          :app:mergeReleaseResources

      - name: Compile every Kotlin source
        run: >-
          ./gradlew --no-daemon --stacktrace
          :engine-core:compileKotlin
          :engine-core:compileTestKotlin
          :engine-platform-android:compileDebugKotlin
          :engine-platform-android:compileReleaseKotlin
          :app:compileDebugKotlin
          :app:compileReleaseKotlin

      - name: Core unit tests
        run: ./gradlew --no-daemon --stacktrace :engine-core:test :engine-core:check

      - name: Strict Android lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :engine-platform-android:lintDebug
          :engine-platform-android:lintRelease
          :app:lintDebug
          :app:lintRelease

      - name: Build debug and unsigned release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Aether-M18-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Aether-M18-QA-Reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
